<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>セルフレジ研修端末</title>


<!-- =====================================================
     QR・JAN読み取り
===================================================== -->

<script src="https://unpkg.com/html5-qrcode"></script>


<!-- =====================================================
     QRコード生成
===================================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<!-- =====================================================
     JAN-13バーコード生成
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


<style>

/* =========================================================
   基本
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

    background: #f3f3f3;

    color: #333333;

}

body {

    overflow-x: hidden;

}

button {

    font-family: inherit;

    cursor: pointer;

}


/* =========================================================
   セブン系イメージカラー
=========================================================

   緑     #008c45
   オレンジ #f58220
   赤     #d71920
   茶     #6b3f2a
   白     #ffffff

========================================================= */


/* =========================================================
   上部ステップ
========================================================= */

.steps {

    width: 100%;

    height: 74px;

    display: flex;

    position: relative;

    background: #ffffff;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.12);

}


.steps::after {

    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 7px;

    background:
        linear-gradient(
            to bottom,
            #008c45 0%,
            #008c45 33%,
            #f58220 33%,
            #f58220 66%,
            #d71920 66%,
            #d71920 100%
        );

}


.step {

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    color: #999999;

    font-size: 18px;

    font-weight: bold;

}


.step.active {

    color: #008c45;

}


.step.active::before {

    content: "";

    position: absolute;

    left: 10%;

    right: 10%;

    bottom: 7px;

    height: 4px;

    background: #008c45;

}


.step-number {

    width: 34px;

    height: 34px;

    margin-right: 9px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #dddddd;

    color: #666666;

}


.step.active .step-number {

    background: #008c45;

    color: #ffffff;

}


/* =========================================================
   画面
========================================================= */

.screen {

    display: none;

    min-height:
        calc(100vh - 74px);

    padding: 20px;

}


.screen.active {

    display: block;

}


/* =========================================================
   タイトル
========================================================= */

.title {

    text-align: center;

    font-size: 28px;

    font-weight: bold;

    margin:
        5px 0 22px;

    color: #333333;

}


/* =========================================================
   カード
========================================================= */

.card {

    background: #ffffff;

    border: 1px solid #dddddd;

    border-radius: 7px;

    padding: 18px;

    box-shadow:
        0 2px 5px rgba(0,0,0,0.08);

}


.card-title {

    font-size: 21px;

    font-weight: bold;

    margin-bottom: 15px;

    padding-left: 12px;

    border-left: 6px solid #f58220;

}


/* =========================================================
   スキャン
========================================================= */

.scan-layout {

    max-width: 1150px;

    margin: auto;

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 18px;

}


#reader {

    width: 100%;

    max-width: 520px;

    margin: auto;

    border-radius: 6px;

    overflow: hidden;

}


.scan-message {

    text-align: center;

    margin-top: 13px;

    font-size: 17px;

    line-height: 1.7;

    color: #666666;

}


.scan-message strong {

    color: #008c45;

}


.error {

    margin-top: 10px;

    text-align: center;

    color: #d71920;

    font-weight: bold;

}


/* =========================================================
   スキャン結果表示
========================================================= */

.scan-result {

    margin-top: 15px;

    padding: 12px;

    border-radius: 6px;

    background: #edf8f2;

    border: 2px solid #008c45;

    text-align: center;

    font-size: 18px;

    font-weight: bold;

    color: #008c45;

    min-height: 48px;

}


/* =========================================================
   カート
========================================================= */

.cart {

    max-height: 47vh;

    overflow-y: auto;

}


.empty {

    text-align: center;

    padding: 45px 10px;

    color: #999999;

    font-size: 17px;

}


.product-row {

    display: grid;

    grid-template-columns:
        1fr
        55px
        110px
        65px;

    align-items: center;

    gap: 8px;

    padding: 14px 0;

    border-bottom: 1px solid #dddddd;

}


.product-name {

    font-size: 18px;

    font-weight: bold;

}


.product-code {

    color: #008c45;

    font-size: 12px;

    margin-top: 4px;

}


.qty {

    text-align: center;

    font-size: 19px;

}


.price {

    text-align: right;

    font-size: 18px;

    font-weight: bold;

}


.remove {

    border: 0;

    border-radius: 5px;

    padding: 9px 4px;

    background: #eeeeee;

    color: #555555;

}


/* =========================================================
   合計
========================================================= */

.total-box {

    max-width: 1150px;

    margin:
        16px auto 0;

    padding:
        15px 22px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    background: #ffffff;

    border-top: 5px solid #f58220;

    border-radius: 6px;

    box-shadow:
        0 2px 5px rgba(0,0,0,0.08);

}


.total-count {

    font-size: 21px;

}


.total-price {

    font-size: 40px;

    font-weight: bold;

    color: #d71920;

}


/* =========================================================
   ボタン
========================================================= */

.button {

    min-height: 62px;

    padding:
        10px 22px;

    border: 0;

    border-radius: 6px;

    font-size: 20px;

    font-weight: bold;

}


.button-orange {

    background: #f58220;

    color: #ffffff;

}


.button-orange:active {

    background: #d9660c;

}


.button-green {

    background: #008c45;

    color: #ffffff;

}


.button-green:active {

    background: #006d35;

}


.button-gray {

    background: #e8e8e8;

    color: #333333;

}


.button-red {

    background: #d71920;

    color: #ffffff;

}


.bottom-buttons {

    max-width: 1150px;

    margin:
        15px auto 0;

    display: flex;

    justify-content: space-between;

    gap: 15px;

}


.bottom-buttons .button {

    min-width: 180px;

}


/* =========================================================
   支払い
========================================================= */

.payment-layout {

    max-width: 900px;

    margin: auto;

}


.payment-total {

    background: #ffffff;

    border-top: 5px solid #f58220;

    border-radius: 6px;

    text-align: center;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 2px 5px rgba(0,0,0,0.08);

}


.payment-total-label {

    font-size: 18px;

}


.payment-total-price {

    font-size: 44px;

    font-weight: bold;

    color: #d71920;

    margin-top: 5px;

}


.payment-grid {

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 14px;

}


.payment-button {

    min-height: 140px;

    background: #ffffff;

    border: 3px solid #008c45;

    border-radius: 8px;

    font-size: 22px;

    font-weight: bold;

    color: #333333;

}


.payment-button:active {

    background: #edf8f2;

}


.payment-icon {

    display: block;

    font-size: 44px;

    margin-bottom: 8px;

}


/* =========================================================
   現金
========================================================= */

.cash-layout {

    max-width: 600px;

    margin: auto;

}


.cash-box {

    background: #ffffff;

    border-top: 5px solid #008c45;

    border-radius: 6px;

    padding: 20px;

    box-shadow:
        0 2px 5px rgba(0,0,0,0.08);

}


.cash-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 21px;

    padding: 7px 0;

}


.cash-total {

    font-size: 31px;

    font-weight: bold;

    color: #d71920;

}


.received {

    margin-top: 15px;

}


.received-label {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 8px;

}


.received-display {

    width: 100%;

    height: 72px;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    padding: 8px 15px;

    border: 3px solid #008c45;

    border-radius: 7px;

    background: #f8f8f8;

    font-size: 36px;

    font-weight: bold;

}


.keypad {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-top: 12px;

}


.key {

    height: 68px;

    border: 1px solid #aaaaaa;

    border-radius: 7px;

    background: #ffffff;

    font-size: 28px;

    font-weight: bold;

}


.key:active {

    background: #dddddd;

}


.key-clear {

    background: #eeeeee;

}


.cash-pay {

    width: 100%;

    margin-top: 12px;

}


/* =========================================================
   完了
========================================================= */

.result-box {

    max-width: 650px;

    margin:
        20px auto;

    padding: 28px;

    background: #ffffff;

    border: 4px solid #008c45;

    border-radius: 9px;

    text-align: center;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.08);

}


.result-title {

    font-size: 25px;

    font-weight: bold;

    color: #008c45;

}


.result-change {

    margin:
        10px 0;

    color: #d71920;

    font-size: 58px;

    font-weight: bold;

}


.result-message {

    font-size: 20px;

}


.complete-buttons {

    max-width: 650px;

    margin: auto;

}


/* =========================================================
   商品コード印刷画面
========================================================= */

.labels-screen {

    display: none;

    min-height: 100vh;

    padding: 20px;

    background: #eeeeee;

}


.labels-screen.active {

    display: block;

}


.labels-header {

    max-width: 1100px;

    margin: auto;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;

}


.labels-title {

    font-size: 28px;

    font-weight: bold;

    color: #008c45;

}


/* =========================================================
   QR・JANを完全に別カード
========================================================= */

.code-print-grid {

    max-width: 1100px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;

}


.code-card {

    background: #ffffff;

    border: 3px solid #008c45;

    border-radius: 8px;

    padding: 20px;

    min-height: 330px;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


.code-card.jan-card {

    border-color: #f58220;

}


.code-type {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 12px;

    color: #008c45;

}


.jan-card .code-type {

    color: #f58220;

}


.code-product-name {

    font-size: 22px;

    font-weight: bold;

}


.code-price {

    font-size: 26px;

    font-weight: bold;

    color: #d71920;

    margin-bottom: 12px;

}


.code-number {

    margin-top: 8px;

    font-size: 16px;

    letter-spacing: 1px;

}


.qr-container {

    width: 160px;

    height: 160px;

    display: flex;

    align-items: center;

    justify-content: center;

}


.jan-barcode {

    width: 90%;

    max-width: 360px;

    height: 90px;

}


.code-description {

    margin-top: 10px;

    color: #666666;

    font-size: 14px;

}


/* =========================================================
   印刷
========================================================= */

@media print {

    body {

        background: #ffffff;

    }


    .labels-header {

        display: none;

    }


    .labels-screen {

        display: block;

        padding: 0;

    }


    .code-print-grid {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 8px;

    }


    .code-card {

        page-break-inside: avoid;

        min-height: 300px;

        border: 2px solid #333333;

    }

}


/* =========================================================
   iPad
========================================================= */

@media (max-width: 750px) {

    .steps {

        height: 68px;

    }


    .step {

        font-size: 13px;

    }


    .step-number {

        width: 25px;

        height: 25px;

        margin-right: 4px;

    }


    .screen {

        padding: 12px;

    }


    .title {

        font-size: 23px;

    }


    .scan-layout {

        grid-template-columns: 1fr;

    }


    .payment-grid {

        grid-template-columns:
            1fr 1fr;

    }


    .product-row {

        grid-template-columns:
            1fr
            45px
            90px;

    }


    .product-row .remove {

        display: none;

    }


    .total-price {

        font-size: 31px;

    }


    .bottom-buttons {

        flex-direction: column;

    }


    .bottom-buttons .button {

        width: 100%;

    }


    .code-print-grid {

        grid-template-columns: 1fr;

    }

}


/* =========================================================
   横向きiPad
========================================================= */

@media (min-width: 751px) {

    .scan-layout {

        min-height: 430px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     レジ本体
===================================================== -->

<div id="app">


    <!-- =================================================
         上部ステップ
    ================================================== -->

    <div class="steps">


        <div id="step1"
             class="step active">

            <span class="step-number">
                1
            </span>

            商品スキャン

        </div>


        <div id="step2"
             class="step">

            <span class="step-number">
                2
            </span>

            お支払い

        </div>


        <div id="step3"
             class="step">

            <span class="step-number">
                3
            </span>

            完了

        </div>


    </div>



    <!-- =================================================
         商品スキャン画面
    ================================================== -->

    <section id="screenScan"
             class="screen active">


        <div class="title">

            商品をスキャンしてください

        </div>


        <div class="scan-layout">


            <!-- カメラ -->

            <div class="card">


                <div class="card-title">

                    バーコードをスキャン

                </div>


                <div id="reader"></div>


                <div class="scan-message">

                    <strong>
                        QRコード・JANコード対応
                    </strong>

                    <br>

                    商品のコードを
                    カメラに向けてください

                </div>


                <div id="scanResult"
                     class="scan-result">

                    スキャン待機中

                </div>


                <div id="scanError"
                     class="error">

                </div>


            </div>


            <!-- カート -->

            <div class="card">


                <div class="card-title">

                    お買い上げ商品

                </div>


                <div id="cart"
                     class="cart">


                    <div class="empty">

                        商品をスキャンしてください

                    </div>


                </div>


            </div>


        </div>


        <!-- 合計 -->

        <div class="total-box">


            <div class="total-count">

                合計

                <strong id="totalCount">
                    0
                </strong>

                点

            </div>


            <div class="total-price">

                ￥<span id="total">
                    0
                </span>

            </div>


        </div>


        <!-- 操作 -->

        <div class="bottom-buttons">


            <button
                class="button button-gray"
                onclick="clearCart()">

                商品を全部削除

            </button>


            <button
                class="button button-orange"
                onclick="goPayment()">

                お支払いへ

            </button>


        </div>


        <div class="bottom-buttons">


            <button
                class="button button-green"
                onclick="showLabels()">

                商品QR・JANを表示・印刷

            </button>


        </div>


    </section>



    <!-- =================================================
         支払い方法
    ================================================== -->

    <section id="screenPayment"
             class="screen">


        <div class="title">

            お支払い方法を選択してください

        </div>


        <div class="payment-layout">


            <div class="payment-total">


                <div class="payment-total-label">

                    お買い上げ金額

                </div>


                <div class="payment-total-price">

                    ￥<span id="paymentTotal">
                        0
                    </span>

                </div>


            </div>


            <div class="payment-grid">


                <button
                    class="payment-button"
                    onclick="selectPayment('cash')">

                    <span class="payment-icon">
                        💴
                    </span>

                    現金

                </button>


                <button
                    class="payment-button"
                    onclick="selectPayment('credit')">

                    <span class="payment-icon">
                        💳
                    </span>

                    クレジットカード

                </button>


                <button
                    class="payment-button"
                    onclick="selectPayment('electronic')">

                    <span class="payment-icon">
                        📱
                    </span>

                    電子マネー

                </button>


                <button
                    class="payment-button"
                    onclick="selectPayment('other')">

                    <span class="payment-icon">
                        🟢
                    </span>

                    その他

                </button>


            </div>


            <div class="bottom-buttons">


                <button
                    class="button button-gray"
                    onclick="showScreen('scan')">

                    戻る

                </button>


            </div>


        </div>


    </section>



    <!-- =================================================
         現金支払い
    ================================================== -->

    <section id="screenCash"
             class="screen">


        <div class="title">

            現金でお支払い

        </div>


        <div class="cash-layout">


            <div class="cash-box">


                <div class="cash-row">

                    <span>
                        合計
                    </span>

                    <span class="cash-total">

                        ￥<span id="cashTotal">
                            0
                        </span>

                    </span>

                </div>


                <div class="received">


                    <div class="received-label">

                        お預かり金額

                    </div>


                    <div id="received"
                         class="received-display">

                        0

                    </div>


                </div>


                <!-- テンキー -->

                <div class="keypad">


                    <button
                        class="key"
                        onclick="keyPress('1')">

                        1

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('2')">

                        2

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('3')">

                        3

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('4')">

                        4

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('5')">

                        5

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('6')">

                        6

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('7')">

                        7

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('8')">

                        8

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('9')">

                        9

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('0')">

                        0

                    </button>


                    <button
                        class="key"
                        onclick="keyPress('00')">

                        00

                    </button>


                    <button
                        class="key key-clear"
                        onclick="clearReceived()">

                        訂正

                    </button>


                </div>


                <div id="cashError"
                     class="error">

                </div>


                <button
                    class="button button-green cash-pay"
                    onclick="payCash()">

                    お支払い

                </button>


                <button
                    class="button button-gray cash-pay"
                    onclick="showScreen('payment')">

                    戻る

                </button>


            </div>


        </div>


    </section>



    <!-- =================================================
         完了
    ================================================== -->

    <section id="screenComplete"
             class="screen">


        <div class="title">

            お支払い完了

        </div>


        <div class="result-box">


            <div class="result-title">

                お支払いありがとうございます

            </div>


            <div style="margin-top:20px;">

                お買い上げ金額

            </div>


            <div style="
                font-size:30px;
                font-weight:bold;
            ">

                ￥<span id="completeTotal">
                    0
                </span>

            </div>


            <div style="margin-top:15px;">

                お預かり

            </div>


            <div style="
                font-size:30px;
                font-weight:bold;
            ">

                ￥<span id="completeReceived">
                    0
                </span>

            </div>


            <div style="margin-top:20px;">

                おつり

            </div>


            <div class="result-change">

                ￥<span id="change">
                    0
                </span>

            </div>


            <div class="result-message">

                おつりをお受け取りください

            </div>


        </div>


        <div class="complete-buttons">


            <button
                class="button button-orange"
                style="width:100%;"
                onclick="newCustomer()">

                次のお客様へ

            </button>


        </div>


    </section>


</div>



<!-- =====================================================
     QR・JAN印刷画面
===================================================== -->

<section id="labelsScreen"
         class="labels-screen">


    <div class="labels-header">


        <div class="labels-title">

            研修用 商品コード

        </div>


        <div>


            <button
                class="button button-orange"
                onclick="window.print()">

                印刷する

            </button>


            <button
                class="button button-gray"
                onclick="hideLabels()">

                戻る

            </button>


        </div>


    </div>


    <div id="labelsGrid"
         class="code-print-grid">

    </div>


</section>



<script>

/* =========================================================
   商品マスタ
=========================================================

   QRコード
   ↓
   A001などの商品コード

   JAN
   ↓
   13桁の研修用JAN

========================================================= */

const products = {


    "A001": {

        name: "しゃけのおにぎり",

        price: 198,

        jan: "4900000000018"

    },


    "A002": {

        name: "おーいお茶",

        price: 147,

        jan: "4900000000025"

    },


    "A003": {

        name: "からあげくん",

        price: 320,

        jan: "4900000000032"

    },


    "A004": {

        name: "大福",

        price: 224,

        jan: "4900000000049"

    },


    "A005": {

        name: "ポテトチップス",

        price: 298,

        jan: "4900000000056"

    },


    "A006": {

        name: "洗濯用洗剤（詰め替え用）",

        price: 498,

        jan: "4900000000063"

    },


    "A007": {

        name: "コーラ",

        price: 150,

        jan: "4900000000070"

    },


    "A008": {

        name: "ガリガリ君",

        price: 92,

        jan: "4900000000087"

    },


    "A009": {

        name: "カップヌードル",

        price: 250,

        jan: "4900000000094"

    },


    "A010": {

        name: "チョコレート",

        price: 198,

        jan: "4900000000100"

    },


    "A011": {

        name: "袋",

        price: 5,

        jan: "4900000000117"

    }


};


/* =========================================================
   変数
========================================================= */

let cart = [];

let received = "0";

let scanner = null;

let lastScan = "";

let lastScanTime = 0;

let audioContext = null;


/* =========================================================
   スキャン音
=========================================================

   ブラウザ内で電子音を生成します。

   外部MP3不要。

========================================================= */

function playScanSound() {

    try {


        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();

        }


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.setValueAtTime(

            1800,

            audioContext.currentTime

        );


        oscillator.frequency
            .exponentialRampToValueAtTime(

                1100,

                audioContext.currentTime + 0.08

            );


        gain.gain.setValueAtTime(

            0.25,

            audioContext.currentTime

        );


        gain.gain
            .exponentialRampToValueAtTime(

                0.001,

                audioContext.currentTime + 0.12

            );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();


        oscillator.stop(

            audioContext.currentTime + 0.12

        );


    }

    catch(error) {

        console.log(
            "音声再生エラー",
            error
        );

    }

}


/* =========================================================
   商品検索
========================================================= */

function findProduct(code) {


    code =
        code.trim();


    /* QRコード */

    if (
        products[code]
    ) {


        return {

            code: code,

            product: products[code]

        };

    }


    /* JANコード */

    for (
        const qrCode in products
    ) {


        if (
            products[qrCode].jan === code
        ) {


            return {

                code: qrCode,

                product: products[qrCode]

            };

        }

    }


    return null;

}


/* =========================================================
   合計
========================================================= */

function getTotal() {


    return cart.reduce(

        function(sum, item) {


            return sum +

                item.price *

                item.quantity;


        },

        0

    );

}


/* =========================================================
   点数
========================================================= */

function getCount() {


    return cart.reduce(

        function(sum, item) {


            return sum +

                item.quantity;


        },

        0

    );

}


/* =========================================================
   商品追加
========================================================= */

function addProduct(code) {


    const product =
        products[code];


    if (!product) {

        return;

    }


    const existing =
        cart.find(

            function(item) {

                return item.code === code;

            }

        );


    if (existing) {


        existing.quantity++;


    }

    else {


        cart.push({

            code: code,

            name: product.name,

            price: product.price,

            quantity: 1

        });

    }


    updateCart();

}


/* =========================================================
   カート更新
========================================================= */

function updateCart() {


    const element =
        document.getElementById(
            "cart"
        );


    if (
        cart.length === 0
    ) {


        element.innerHTML = `

            <div class="empty">

                商品をスキャンしてください

            </div>

        `;

    }

    else {


        let html = "";


        cart.forEach(

            function(item, index) {


                const subtotal =

                    item.price *

                    item.quantity;


                html += `

                    <div class="product-row">


                        <div>

                            <div class="product-name">

                                ${escapeHtml(item.name)}

                            </div>


                            <div class="product-code">

                                ${item.code}

                            </div>

                        </div>


                        <div class="qty">

                            ${item.quantity}

                        </div>


                        <div class="price">

                            ￥${subtotal.toLocaleString()}

                        </div>


                        <button
                            class="remove"
                            onclick="removeItem(${index})">

                            削除

                        </button>


                    </div>

                `;

            }

        );


        element.innerHTML =
            html;

    }


    document.getElementById("total")
        .textContent =

        getTotal()
            .toLocaleString();


    document.getElementById("totalCount")
        .textContent =

        getCount();

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(text) {


    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   商品削除
========================================================= */

function removeItem(index) {


    cart.splice(
        index,
        1
    );


    updateCart();

}


/* =========================================================
   全商品削除
========================================================= */

function clearCart() {


    if (
        cart.length === 0
    ) {

        return;

    }


    if (
        confirm(
            "商品をすべて削除しますか？"
        )
    ) {


        cart = [];


        updateCart();


    }

}


/* =========================================================
   支払いへ
========================================================= */

function goPayment() {


    if (
        cart.length === 0
    ) {


        alert(
            "商品をスキャンしてください。"
        );


        return;

    }


    document.getElementById(
        "paymentTotal"
    )
    .textContent =

        getTotal()
            .toLocaleString();


    showScreen(
        "payment"
    );

}


/* =========================================================
   支払い方法
========================================================= */

function selectPayment(type) {


    const total =
        getTotal();


    /* 現金 */

    if (
        type === "cash"
    ) {


        document.getElementById(
            "cashTotal"
        )
        .textContent =

            total.toLocaleString();


        received =
            "0";


        document.getElementById(
            "received"
        )
        .textContent =
            "0";


        document.getElementById(
            "cashError"
        )
        .textContent =
            "";


        showScreen(
            "cash"
        );


        return;

    }


    /*
     * 現金以外は研修用として
     * 即時決済
     */

    document.getElementById(
        "completeTotal"
    )
    .textContent =

        total.toLocaleString();


    document.getElementById(
        "completeReceived"
    )
    .textContent =

        total.toLocaleString();


    document.getElementById(
        "change"
    )
    .textContent =
        "0";


    showScreen(
        "complete"
    );

}


/* =========================================================
   テンキー
========================================================= */

function keyPress(value) {


    if (
        received === "0"
    ) {

        received = "";

    }


    received += value;


    received =
        received.replace(
            /\D/g,
            ""
        );


    if (
        received.length > 8
    ) {


        received =
            received.substring(
                0,
                8
            );

    }


    document.getElementById(
        "received"
    )
    .textContent =

        Number(
            received || 0
        )
        .toLocaleString();

}


/* =========================================================
   預かり金訂正
========================================================= */

function clearReceived() {


    received =
        "0";


    document.getElementById(
        "received"
    )
    .textContent =
        "0";


    document.getElementById(
        "cashError"
    )
    .textContent =
        "";

}


/* =========================================================
   現金支払い
========================================================= */

function payCash() {


    const total =
        getTotal();


    const money =
        Number(received);


    const error =
        document.getElementById(
            "cashError"
        );


    error.textContent =
        "";


    if (
        money < total
    ) {


        const shortage =
            total - money;


        error.textContent =

            "お預かり金額が " +

            shortage.toLocaleString() +

            "円不足しています。";


        return;

    }


    const change =
        money - total;


    document.getElementById(
        "completeTotal"
    )
    .textContent =

        total.toLocaleString();


    document.getElementById(
        "completeReceived"
    )
    .textContent =

        money.toLocaleString();


    document.getElementById(
        "change"
    )
    .textContent =

        change.toLocaleString();


    showScreen(
        "complete"
    );

}


/* =========================================================
   画面切り替え
========================================================= */

function showScreen(name) {


    const screens = {


        scan:
            "screenScan",


        payment:
            "screenPayment",


        cash:
            "screenCash",


        complete:
            "screenComplete"


    };


    Object.values(screens)
        .forEach(

            function(id) {


                document.getElementById(id)
                    .classList
                    .remove("active");

            }

        );


    document.getElementById(
        screens[name]
    )
    .classList
    .add("active");


    updateSteps(
        name
    );

}


/* =========================================================
   ステップ更新
========================================================= */

function updateSteps(name) {


    document.getElementById("step1")
        .classList
        .remove("active");


    document.getElementById("step2")
        .classList
        .remove("active");


    document.getElementById("step3")
        .classList
        .remove("active");


    if (
        name === "scan"
    ) {


        document.getElementById("step1")
            .classList
            .add("active");

    }


    if (
        name === "payment" ||
        name === "cash"
    ) {


        document.getElementById("step2")
            .classList
            .add("active");

    }


    if (
        name === "complete"
    ) {


        document.getElementById("step3")
            .classList
            .add("active");

    }

}


/* =========================================================
   次のお客様
========================================================= */

function newCustomer() {


    cart = [];


    received =
        "0";


    document.getElementById(
        "received"
    )
    .textContent =
        "0";


    document.getElementById(
        "cashError"
    )
    .textContent =
        "";


    document.getElementById(
        "scanError"
    )
    .textContent =
        "";


    document.getElementById(
        "scanResult"
    )
    .textContent =
        "スキャン待機中";


    updateCart();


    showScreen(
        "scan"
    );

}


/* =========================================================
   ★ スキャン成功
========================================================= */

function onScanSuccess(decodedText) {


    const code =
        decodedText.trim();


    const now =
        Date.now();


    /*
     * 同じコードを
     * 1.5秒以内に連続読み取りしない
     */

    if (

        code === lastScan &&

        now - lastScanTime < 1500

    ) {

        return;

    }


    lastScan =
        code;


    lastScanTime =
        now;


    const result =
        findProduct(code);


    /*
     * 登録されていない商品
     */

    if (!result) {


        document.getElementById(
            "scanError"
        )
        .textContent =

            "登録されていない商品です："
            + code;


        return;

    }


    /*
     * =========================================
     * ★ 商品が正常に読み取れた
     * =========================================
     *
     * ここで「ピッ♪」
     */

    playScanSound();


    /*
     * 商品を追加
     */

    addProduct(
        result.code
    );


    /*
     * スキャン結果表示
     */

    document.getElementById(
        "scanResult"
    )
    .textContent =

        "ピッ♪　"

        + result.product.name

        + "　￥"

        + result.product.price
            .toLocaleString();


    document.getElementById(
        "scanError"
    )
    .textContent =
        "";

}


/* =========================================================
   ★ カメラ自動起動
=========================================================

   facingMode: "user"

   ↓

   iPadの内側カメラ

========================================================= */

async function startScanner() {


    try {


        scanner =
            new Html5Qrcode(
                "reader"
            );


        const config = {


            fps: 10,


            qrbox: {

                width: 280,

                height: 180

            },


            aspectRatio:
                1.7777778


        };


        await scanner.start(


            {

                facingMode:
                    "user"

            },


            config,


            onScanSuccess,


            function(errorMessage) {

                /*
                 * 読み取り中の
                 * 一時的なエラーは無視
                 */

            }

        );


    }

    catch(error) {


        console.error(
            error
        );


        document.getElementById(
            "scanError"
        )
        .textContent =

            "カメラを起動できませんでした。"
            + " iPadのカメラ許可を確認してください。";


    }

}


/* =========================================================
   商品コード表示
========================================================= */

function showLabels() {


    const screen =
        document.getElementById(
            "labelsScreen"
        );


    const grid =
        document.getElementById(
            "labelsGrid"
        );


    grid.innerHTML =
        "";


    for (
        const code in products
    ) {


        const product =
            products[code];


        /* =========================================
           QRカード
        ========================================= */

        const qrCard =
            document.createElement(
                "div"
            );


        qrCard.className =
            "code-card";


        qrCard.innerHTML = `

            <div class="code-type">

                QRコード

            </div>


            <div class="code-product-name">

                ${escapeHtml(product.name)}

            </div>


            <div class="code-price">

                ￥${product.price.toLocaleString()}

            </div>


            <div
                class="qr-container"
                id="qr-${code}">

            </div>


            <div class="code-number">

                商品コード：${code}

            </div>


            <div class="code-description">

                QRコードを
                セルフレジで読み取ってください

            </div>

        `;


        grid.appendChild(
            qrCard
        );


        /*
         * QR生成
         */

        new QRCode(

            document.getElementById(
                "qr-" + code
            ),

            {

                text: code,

                width: 150,

                height: 150,

                correctLevel:
                    QRCode.CorrectLevel.M

            }

        );


        /* =========================================
           JANカード
        ========================================= */

        const janCard =
            document.createElement(
                "div"
            );


        janCard.className =
            "code-card jan-card";


        janCard.innerHTML = `

            <div class="code-type">

                JANバーコード

            </div>


            <div class="code-product-name">

                ${escapeHtml(product.name)}

            </div>


            <div class="code-price">

                ￥${product.price.toLocaleString()}

            </div>


            <svg
                class="jan-barcode"
                id="barcode-${code}">

            </svg>


            <div class="code-number">

                ${product.jan}

            </div>


            <div class="code-description">

                JANバーコードを
                セルフレジで読み取ってください

            </div>

        `;


        grid.appendChild(
            janCard
        );


        /*
         * JAN生成
         */

        try {


            JsBarcode(

                "#barcode-" + code,

                product.jan,

                {

                    format: "ean13",

                    width: 2,

                    height: 75,

                    displayValue: false,

                    margin: 5

                }

            );


        }

        catch(error) {


            console.error(
                "JAN生成エラー:",
                error
            );


        }

    }


    screen.classList.add(
        "active"
    );


    document.getElementById(
        "app"
    )
    .style.display =
        "none";

}


/* =========================================================
   商品コード画面を閉じる
========================================================= */

function hideLabels() {


    document.getElementById(
        "labelsScreen"
    )
    .classList
    .remove("active");


    document.getElementById(
        "app"
    )
    .style.display =
        "block";

}


/* =========================================================
   ページ起動
========================================================= */

window.addEventListener(
    "load",
    function() {


        updateCart();


        /*
         * カメラ自動起動
         */

        startScanner();


    }
);

</script>


</body>

</html>
